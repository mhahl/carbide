# Example inventory — copy to inventory.ini and edit. Secrets belong in a
# vault file (see README.md), not here.
[carbide_servers]
server1 ansible_host=10.8.0.5

[carbide_sensors]
sensor1 ansible_host=10.8.0.11 carbide_sensor_id=sensor-01
sensor2 ansible_host=10.8.0.12 carbide_sensor_id=sensor-02

# --- server vars ---------------------------------------------------------
[carbide_servers:vars]
carbide_api_addr = 10.8.0.5
carbide_api_allow_subnets = ['10.8.0.0/24']
carbide_nft_resolver = 10.8.0.1
# carbide_sensor_tokens and carbide_db_password: vault (see README.md).

# --- sensor vars -----------------------------------------------------------
[carbide_sensors:vars]
carbide_sensor_server_host = 10.8.0.5
# carbide_sensor_token: vault, one per sensor — set in host_vars, e.g.
# host_vars/sensor1.yml: carbide_sensor_token: !vault ...

# --- single-host dev (server + sensor on one box) ---------------------------
# Put the same host in both groups and split the config paths so the roles
# install systemd drop-ins instead of sharing /etc/carbide/config.toml:
#
#   [carbide_servers]
#   devbox ansible_host=127.0.0.1 ansible_connection=local
#   [carbide_sensors]
#   devbox ansible_host=127.0.0.1 ansible_connection=local
#   [carbide_servers:vars]
#   carbide_server_config_path = /etc/carbide/server.toml
#   [carbide_sensors:vars]
#   carbide_sensor_config_path = /etc/carbide/sensor.toml
#   carbide_sensor_id = sensor-01
#   carbide_sensor_server_host = 127.0.0.1
