---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true

- name: Apply nft egress rules
  ansible.builtin.command: /usr/sbin/nft -f /etc/carbide/carbide-egress.nft
  changed_when: true

- name: Restart squid
  ansible.builtin.systemd:
    name: squid
    state: restarted

- name: Restart carbide-server
  ansible.builtin.systemd:
    name: carbide-server
    state: restarted
