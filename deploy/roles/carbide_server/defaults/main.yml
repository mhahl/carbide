# Defaults for the carbide_server role. Mirror packaging/config-server.toml.example.
# REQUIRED (no default): carbide_db_password, carbide_sensor_tokens.

# Single-host dev: point this at e.g. /etc/carbide/server.toml and the role
# installs a systemd drop-in overriding ExecStart. Multi-host: leave default.
carbide_server_config_path: /etc/carbide/config.toml
carbide_src: "{{ playbook_dir }}/.."     # control-node checkout to ship
carbide_src_dir: /opt/carbide/src        # where it lands on the target
carbide_pip_extra_args: "--break-system-packages"
carbide_force_reinstall: false           # reinstall even if version unchanged

carbide_api_addr: "127.0.0.1"   # set to the VPN interface when sensors are remote
carbide_api_port: 8440
# carbide_sensor_tokens: { sensor-01 = "TOKEN" }   # REQUIRED, use vault
carbide_db_name: carbide
carbide_db_user: carbide
# carbide_db_password: "CHANGE-ME"                 # REQUIRED, use vault

carbide_blob_dir: /var/lib/carbide/blobs
carbide_log_dir: /var/log/carbide

carbide_podman_socket: "unix:///run/podman/podman.sock"
carbide_podman_image: "carbide-honeypot:latest"
carbide_podman_network: carbide
carbide_container_subnet: "10.89.0.0/24"  # explicit so Squid/nft match it
carbide_container_gateway: "10.89.0.1"
carbide_port_range_start: 22000
carbide_port_range_end: 22100
carbide_container_user: honey
carbide_memory_mb: 256
carbide_pids_limit: 128
carbide_pool_size: 2
carbide_ssh_host: ""                     # "" = api_addr

carbide_keep_warm_minutes: 10
carbide_max_containers: 200
carbide_idle_ttl_active_days: 30
carbide_idle_ttl_inactive_hours: 24
carbide_snapshot_retention: 10
carbide_commit_per_session: true

carbide_forensics_max_file_bytes: 1048576
carbide_forensics_include_full_export: false

carbide_squid_mode: transparent          # or "explicit"
carbide_squid_log_path: /var/log/squid/access.log
# Transparent mode only:
carbide_nft_apply: true                  # template + apply + persist at boot
# carbide_nft_resolver: "10.0.0.1"       # REQUIRED when transparent: site DNS
carbide_manage_firewall: true
carbide_api_allow_subnets: []            # e.g. ["10.8.0.0/24"]; [] = no rule

carbide_blob_max_bytes: 10737418240
carbide_session_max_bytes: 104857600
carbide_log_level: INFO
carbide_rebuild_image: false             # build even if the image exists
