# Carbide Squid config: HTTP logging + HTTPS peek-and-splice (NO decryption).
#
# Containers reach the web only through here. Plain HTTP is logged in full;
# TLS is peeked for the SNI hostname and then spliced through untouched, so
# certificates always verify exactly as on the real internet.
#
# Two listeners:
#   3128 explicit forward proxy (fallback; containers use HTTP_PROXY)
#   3129/3130 transparent intercept (requires the nftables rules in
#          squid/nftables.conf.snippet on the podman host)
#
# Attribution: carbide-server tails access.log and maps the client IP (the
# container) to the current session. Keep the log format below in sync with
# carbide/server/squid.py.

# --- ports ---------------------------------------------------------------
http_port 3128
http_port 3129 intercept
# Peek-and-splice needs an ssl-bump port but never serves the dummy cert,
# because every connection is spliced, never bumped.
https_port 3130 intercept ssl-bump \
  cert=/etc/squid/splice-dummy.pem \
  generate-host-certificates=off

ssl_bump peek all
ssl_bump splice all

# --- who may use the proxy: podman container networks only ---------------
# The live suite runs this exact file on the default podman network, so the
# ACL keeps 10.88.0.0/16 here. The container image narrows it to the shared
# `carbide` subnet (10.89.0.0/24) at build time — see images/squid/Containerfile.
acl containers src 10.88.0.0/16
http_access allow containers
http_access deny all

# --- never proxy cloud metadata / link-local ------------------------------
acl cloudmeta dst 169.254.169.254 169.254.170.2 100.100.100.200 \
  fd00:ec2::254
http_access deny cloudmeta

# --- safe ports ------------------------------------------------------------
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# --- quotas: cap single response/request bodies -----------------------------
reply_body_max_size 50 MB
request_body_max_size 10 MB

# --- no disk cache: evidence lives in carbide, not in squid -----------------
cache deny all

# --- logging: native format consumed by carbide-server ----------------------
logformat carbide %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %un %Sh/%<a %mt
access_log /var/log/squid/access.log carbide

# --- identity ----------------------------------------------------------------
visible_hostname carbide-egress
httpd_suppress_version_string on
