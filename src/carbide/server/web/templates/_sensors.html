<div class="overflow-x-auto"><table class="table table-sm table-zebra">
<thead><tr><th>Sensor</th><th>Link</th><th>SSH target</th><th>Last seen</th><th></th></tr></thead>
<tbody>
{% for m in managed %}
<tr><td><a class="link font-mono" href="/sensors/{{ m.sensor_id }}">{{ m.sensor_id }}</a></td>
<td>{% if m.sensor_id in live %}<span class="badge badge-success badge-xs">linked</span>{% else %}<span class="badge badge-ghost badge-xs">down</span>{% endif %}</td>
<td class="font-mono text-xs">{{ m.ssh_user or "(default)" }}@{{ m.ssh_host }}:{{ m.ssh_port }}</td>
<td>{{ seen.get(m.sensor_id)|ts }}</td>
<td><a class="link" href="/sessions?sensor={{ m.sensor_id }}">sessions</a></td></tr>
{% endfor %}
</tbody></table></div>
