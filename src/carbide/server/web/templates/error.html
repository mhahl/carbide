{% extends "base.html" %}
{% block title %}Error — Carbide{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto pt-8 flex flex-col gap-4">
<div class="breadcrumbs text-sm">
<ul>
<li><a href="/">Console</a></li>
<li>Error</li>
</ul>
</div>
<div>
<h1 class="text-2xl font-semibold tracking-tight">Something went wrong</h1>
<p class="text-sm text-base-content/60">The console could not complete that request.</p>
</div>
<div class="alert alert-error" role="alert">
<svg xmlns="http://www.w3.org/2000/svg" class="size-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
<span>{{ message }}</span>
</div>
<p><a class="link" href="/">Back to dashboard</a></p>
</div>
{% endblock %}
