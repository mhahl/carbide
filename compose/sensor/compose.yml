# Carbide sensor: SSH front door + spool. Needs only the server's address,
# a unique sensor id, and the shared SENSOR_TOKEN. Start with: ./setup.sh
name: carbide-sensor

services:
  sensor:
    image: quay.io/sigaint/carbide:${TAG:-latest}
    command: ["carbide-sensor", "-c", "/etc/carbide/config.toml"]
    ports:
      - "${LISTEN_ADDR:-0.0.0.0}:${LISTEN_PORT:-2222}:2222"
    volumes:
      # Long syntax on purpose: create_host_path:false fails loud on a
      # missing config instead of auto-creating a directory that would
      # wedge later restarts (crun "Not a directory"). selinux:z keeps the
      # relabel this confined service needs to read the host file.
      - type: bind
        source: ./config.toml
        target: /etc/carbide/config.toml
        read_only: true
        bind:
          create_host_path: false
          selinux: z
      - sensor-spool:/var/lib/carbide/spool
      - sensor-keys:/etc/carbide/keys
    restart: unless-stopped

volumes:
  sensor-spool:
  sensor-keys:
