# Carbide server stack: API/forensics + Postgres + Squid on the shared
# external `carbide` network (created by setup.sh). Honeypot siblings join
# the same network, so they reach Squid as http://squid:3128 and the server
# reaches Postgres as db:5432. Start with: ./setup.sh
name: carbide-server

services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: carbide
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: carbide
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - carbide
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbide"]
      interval: 5s
      timeout: 3s
      retries: 20

  squid:
    image: quay.io/sigaint/carbide-squid:${TAG:-latest}
    volumes:
      - squid-logs:/var/log/squid
    networks:
      - carbide
    restart: unless-stopped

  server:
    image: quay.io/sigaint/carbide:${TAG:-latest}
    command: ["carbide-server", "-c", "/etc/carbide/config.toml"]
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8440}:8440"
    volumes:
      # Host podman socket: siblings are created on the HOST, beside us.
      # Long syntax on purpose: create_host_path:false makes a missing
      # socket a LOUD compose error instead of an auto-created directory,
      # which would wedge the container with:
      #   crun: mount `/run/podman/podman.sock` ... Not a directory
      # (the stale mountpoint type is baked into the container; recovery
      # is down/fix-socket/up). No :z equivalent exists in long syntax;
      # none is needed: this service runs label=disable (unconfined), and
      # setup.sh recreates it on every run, re-binding a recreated host
      # socket fresh.
      - type: bind
        source: /run/podman/podman.sock
        target: /run/podman/podman.sock
        bind:
          create_host_path: false
      # Rendered config: same no-autocreate guard (a directory shadow here
      # would wedge restarts the same way once the real file is rendered).
      - type: bind
        source: ./config.toml
        target: /etc/carbide/config.toml
        read_only: true
        bind:
          create_host_path: false
      # Blob store: named volume by default; point BLOB_MOUNT at a host path
      # (e.g. an NFS mount) to store blobs there instead. See .env.example.
      - ${BLOB_MOUNT:-carbide-blobs:/var/lib/carbide/blobs:z}
      - squid-logs:/var/log/squid:ro
    networks:
      - carbide
    depends_on:
      db:
        condition: service_healthy
    # The server drives the HOST podman socket; Fedora policy forbids confined
    # containers from connecting to it, so SELinux confinement is off for this
    # service (capabilities/devices stay restricted). The sensor needs none.
    security_opt:
      - label=disable
    restart: unless-stopped

networks:
  carbide:
    external: true

volumes:
  db-data:
  carbide-blobs:
  squid-logs:
